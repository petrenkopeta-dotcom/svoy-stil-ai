# TEMPLATE: requires real TLS certificate, server_name and private tester access.
# Do not expose before deployment acceptance. Query strings contain VK credentials.
location /api/staging/ {
    client_max_body_size 16k;
    client_body_buffer_size 32k;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    access_log off;
    error_log /dev/null crit;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    proxy_pass http://127.0.0.1:8788;
}
# No photo ingress until the memory-only pixel pipeline passes acceptance.
location /api/cv-auto { return 503; }
location /api/provider/storage/ { return 503; }
