# Include in http{} on the approved single Linux host. Replace reserved domain
# and certificate paths only after release review. Never log launch credentials.
limit_conn_zone $server_name zone=stylist_connections:1m;
access_log off;
error_log /dev/null crit;
server {
    listen 80;
    server_name stylist.invalid;
    return 444;
}
server {
    listen 443 ssl;
    server_name stylist.invalid;
    if ($host != stylist.invalid) { return 444; }
    ssl_certificate /etc/nginx/tls/staging.crt;
    ssl_certificate_key /etc/nginx/tls/staging.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    root /opt/stylist/current/dist-staging;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    autoindex off;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 16k;
    client_body_buffer_size 32k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 8k;
    client_header_timeout 10s;
    client_body_timeout 20s;
    send_timeout 20s;
    keepalive_timeout 5s;
    limit_conn stylist_connections 16;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Exact parent origins need real VK embedding acceptance before release.
    # SAMEORIGIN X-Frame-Options would block this separate origin inside VK.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors https://vk.com https://vk.ru https://m.vk.com https://m.vk.ru" always;
    location = / { limit_except GET { deny all; } try_files /index.html =404; }
    location = /index.html { limit_except GET { deny all; } try_files $uri =404; }
    location /assets/ { limit_except GET { deny all; } try_files $uri =404; }
    location ^~ /api/staging/photos { return 503; }
    location = /api/staging/profile { return 503; }
    location /api/staging/ {
        if ($args != "") { return 400; }
        proxy_request_buffering off;
        client_body_in_file_only off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        proxy_next_upstream off;
        proxy_http_version 1.1;
        proxy_set_header Host stylist.invalid;
        proxy_set_header Connection close;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Authorization "";
        proxy_pass http://127.0.0.1:8788;
    }
    # Health, CV, provider storage, hidden files and unknown paths stay private.
    location / { return 404; }
}
